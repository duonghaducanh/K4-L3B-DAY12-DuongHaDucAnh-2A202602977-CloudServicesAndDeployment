name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -v --ignore=tests/test_cp5.py --ignore=tests/test_bonus_cicd.py -m 'not docker'
        env:
          REDIS_URL: fake://
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t day12-agent:ci .
      - name: Check image size and non-root user
        run: |
          test "$(docker image inspect day12-agent:ci --format '{{.Size}}')" -lt 524288000
          test "$(docker run --rm --entrypoint id day12-agent:ci -u)" != 0
  deploy:
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.RENDER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy tested commit to Render
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          test -n "$DEPLOY_HOOK"
          curl --fail --silent --show-error --output /dev/null --request POST "${DEPLOY_HOOK}&ref=${GITHUB_SHA}"
      - name: Check public health and readiness
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          test -n "$PUBLIC_URL"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 20 "$PUBLIC_URL/health" && curl --fail --silent --max-time 20 "$PUBLIC_URL/ready"; then
              exit 0
            fi
            sleep 10
          done
          exit 1
