# Use: docker compose -f docker-compose.yml -f docker-compose.scale.yml up -d --scale agent=3
# Requires Docker Compose 2.24.4+ for !reset.
services:
  agent:
    ports: !reset []
  nginx:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      agent:
        condition: service_healthy
